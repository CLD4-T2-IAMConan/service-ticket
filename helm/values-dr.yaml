replicaCount: 2
image:
  repository: ghcr.io/cld4-t2-iamconan/service-ticket
  pullPolicy: Always
  tag: "sha-81f6bff"
imagePullSecrets:
  - name: ghcr-pull-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: passit-dr-alb
    alb.ingress.kubernetes.io/load-balancer-name: passit-dr-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  hosts:
    - host: ticket-service.passit.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
database:
  enabled: true
  host: passit-prod-aurora-cluster.cluster-ro-c1ky2k6y6s3s.ap-northeast-1.rds.amazonaws.com
  port: 5432
  name: ticketservice_db
  user: postgres
  password: postgres
env:
  SPRING_PROFILES_ACTIVE: "production"
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5
monitoring:
  enabled: true
  path: /actuator/prometheus
  interval: 15s
redis:
  host: passit-dr-valkey.kqxlkn.ng.0001.apne1.cache.amazonaws.com
  port: 6379
  password: "" # ElastiCache 비밀번호가 있는 경우 설정
  ssl: true
s3:
  bucket: passit-dr-ticket-images-bucket
