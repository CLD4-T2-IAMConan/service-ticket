{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "service-ticket.fullname" . }}-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: service-ticket.rules
      rules:
        - alert: TicketServiceHigh5xxErrorRate
          expr: |
            100 *
            sum(rate(http_server_requests_seconds_count{
              application="service-ticket",
              status=~"5.."
            }[1m]))
            /
            sum(rate(http_server_requests_seconds_count{
              application="service-ticket"
            }[1m]))
            > 5
          for: 1m
          labels:
            severity: critical
            service: service-ticket
          annotations:
            summary: "Ticket Service 5xx error rate high"
            description: "service-ticket 5xx error rate > 5% for 1 minute"
  {{- end }}
